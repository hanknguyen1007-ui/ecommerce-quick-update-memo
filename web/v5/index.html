<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brand monthly report (v5, chạy trong trình duyệt)</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2230;--mute:#667085;--line:#e2e5ea;--accent:#2457d6;--ok:#188038;--bad:#d93025;--warn:#b26a00;--okbg:#e8f5ec;--badbg:#fdecea;--warnbg:#fff4e0}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1c2029;--ink:#e8ebf1;--mute:#9aa3b2;--line:#2c3240;--accent:#6c93ff;--ok:#5bc27a;--bad:#ff7b72;--warn:#e3a53c;--okbg:#17301f;--badbg:#3a1d1b;--warnbg:#3a2d13}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,"Segoe UI",sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:18px}header span{color:var(--mute);font-size:13px}
main{display:grid;grid-template-columns:minmax(340px,460px) 1fr;gap:16px;padding:16px;max-width:1500px;margin:0 auto}
@media (max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
label{display:block;font-weight:600;font-size:13px;margin:10px 0 4px}
textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-family:Consolas,monospace;font-size:12.5px;resize:vertical;white-space:pre}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:7px 12px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;width:100%;margin-top:12px;padding:10px}
button:disabled{opacity:.5;cursor:wait}
#val{margin-top:8px;font-size:13px}
.ok{color:var(--ok)}.fail{color:var(--bad)}.warn{color:var(--warn)}
#bar{display:none;padding:8px 12px;border-radius:6px;margin-bottom:10px;font-size:13px}
#bar.good{background:var(--okbg);color:var(--ok)}#bar.badbar{background:var(--warnbg);color:var(--warn)}#bar.err{background:var(--badbg);color:var(--bad)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
#preview{border:1px solid var(--line);border-radius:8px;padding:6px 16px;background:var(--bg);max-height:70vh;overflow:auto}
#preview ul{margin:2px 0 2px 0;padding-left:20px}#preview p{margin:10px 0 4px}#preview h2,#preview h3{margin:14px 0 4px}
#meta{font-size:12px;color:var(--mute);margin-top:8px}
.hint{color:var(--mute);font-size:12px}
#loading{padding:40px;text-align:center;color:var(--mute)}
.privacy{font-size:12px;color:var(--mute);max-width:900px;margin:0 auto 10px;padding:0 16px}
</style>
</head>
<body>
<header><h1>Brand performance update (v5)</h1><span>chạy 100% trong trình duyệt (Pyodide) · dữ liệu KHÔNG rời khỏi máy bạn · không LLM, không gửi mạng sau khi trang đã tải</span></header>
<p class="privacy" id="loading">Đang tải Python runtime (Pyodide) lần đầu, có thể mất vài giây — vui lòng đợi...</p>
<main style="display:none" id="app">
<section>
<div class="card">
  <label for="data">Dán dữ liệu (1-2 khối platform, mỗi khối bắt đầu bằng dòng "Date update")</label>
  <textarea id="data" rows="16" wrap="off" style="white-space:pre;overflow-x:auto" spellcheck="false"></textarea>
  <div class="hint" style="margin-top:8px"><a href="#" id="sample">Nạp dữ liệu mẫu — synthetic</a></div>
  <div id="val"></div>
  <button id="gen" class="primary">Tạo báo cáo</button>
</div>
</section>
<section>
<div class="card">
  <div id="bar"></div>
  <label id="ackrow" style="display:none;margin:6px 0"><input type="checkbox" id="ack"> Đã hiểu cảnh báo residual_shift ở trên</label>
  <div class="btns">
    <button id="cmsg" disabled>Copy cho Lark Messenger</button>
    <button id="cdoc" disabled>Copy cho Lark Docs</button>
    <button id="dlmd" disabled>Tải .md</button>
  </div>
  <div id="preview"></div>
  <div id="meta"></div>
</div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
const $=id=>document.getElementById(id);
function esc(s){return (s+"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

const ROOT = "../../";  // web/v5/index.html -> perf-local root (2 levels up)
const FILES = [
  "core/__init__.py","core/tsv.py","core/numfmt.py",
  "v4/__init__.py","v4/adapters/__init__.py","v4/adapters/base.py",
  "v5/__init__.py","v5/config.py","v5/numfmt.py","v5/render.py","v5/facts.py","v5/pipeline.py",
  "v5/adapters/__init__.py","v5/adapters/brand_monthly.py",
  "v5/surfaces/__init__.py","v5/surfaces/text.py",
  "templates/brand-monthly/schema.toml",
];
let pyodideReady=null;
async function initPyodide(){
  const pyodide = await loadPyodide();
  for(const f of FILES){
    const text = await (await fetch(ROOT+f)).text();
    const path = "/app/"+f;
    const dir = path.substring(0, path.lastIndexOf("/"));
    pyodide.FS.mkdirTree(dir);
    pyodide.FS.writeFile(path, text, {encoding:"utf8"});
  }
  await pyodide.runPythonAsync(`
import sys
sys.path.insert(0, "/app")
from v5 import pipeline as P
`);
  return pyodide;
}
pyodideReady = initPyodide().then(p=>{ $('loading').style.display='none'; $('app').style.display=''; return p; })
  .catch(e=>{ $('loading').textContent = "Lỗi tải Pyodide: "+e; throw e; });

let lastResult=null;
function gate(){
  const need = $('ackrow').style.display!=='none' && !$('ack').checked;
  for(const id of ['cmsg','cdoc','dlmd']) $(id).disabled = !lastResult || need;
}
$('ack').onchange = gate;

function bar(kind, html){ const b=$('bar'); b.className=kind; b.style.display='block'; b.innerHTML=html; }

function clearResult(){
  lastResult = null;
  $('preview').innerHTML = '';
  $('meta').textContent = '';
  $('ackrow').style.display = 'none';
  $('bar').style.display = 'none';
  $('bar').innerHTML = '';
  gate();
}

async function generate(){
  clearResult();
  const pyodide = await pyodideReady;
  const text = $('data').value;
  if(!text.trim()){ bar('err', 'Chưa có dữ liệu.'); return; }
  pyodide.globals.set('_text', text);
  const resultJson = await pyodide.runPythonAsync(`
import json
json.dumps(P.build(_text), ensure_ascii=False)
`);
  const r = JSON.parse(resultJson);
  if(!r.ok){
    const fails = (r.checks||[]).filter(c=>c.status==='fail');
    bar('err', fails.length ? esc(fails[0].detail) : 'Không nhận diện được dữ liệu.');
    return;
  }
  show(r);
}
$('gen').onclick = ()=>generate().catch(e=>{ clearResult(); bar('err','Lỗi: '+esc(e.message||e)); });

// decision 11: residual_shift (or any other data flag) -> banner explains, Copy stays blocked until
// the user ticks the acknowledgement; the explanation itself never rides along in the copied text.
function show(r){
  $('preview').innerHTML = r.out.html_doc;
  lastResult = r;
  const flaggedPlatforms = (r.flags && r.flags.residual_shift) || [];
  if(flaggedPlatforms.length){
    bar('badbar', 'Cảnh báo: ' + flaggedPlatforms.join(', ') +
      ' — Livestream giảm mạnh trong khi Showcase&other tăng mạnh cùng kỳ. Rất có thể Showcase&other ' +
      'đang "hứng" phần GMV mà một nguồn khác (ví dụ Livestream) đang ghi nhận trễ/thiếu, không phải tăng ' +
      'trưởng thật. Kiểm tra lại nguồn trước khi gửi báo cáo này.');
  } else {
    bar('good', 'Không có cảnh báo.');
  }
  $('ack').checked=false; $('ackrow').style.display = flaggedPlatforms.length?'block':'none';
  $('meta').textContent = 'Không dùng LLM (v5: 100% Python, chạy trong trình duyệt)';
  gate();
}

async function copyRich(html, text){
  await navigator.clipboard.write([new ClipboardItem({'text/html': new Blob([html],{type:'text/html'}), 'text/plain': new Blob([text],{type:'text/plain'})})]);
}
$('cmsg').onclick = ()=> lastResult && copyRich(lastResult.out.html_msg, lastResult.out.text).catch(e=>alert(e.message));
$('cdoc').onclick = ()=> lastResult && copyRich(lastResult.out.html_doc, lastResult.out.text).catch(e=>alert(e.message));
$('dlmd').onclick = ()=>{
  if(!lastResult) return;
  const blob = new Blob([lastResult.out.md], {type:'text/markdown'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'brand_report.md'; a.click();
};

// synthetic sample only (H6/decision: fake brand/numbers, never the pinned real-data golden)
$('sample').onclick = async e=>{ e.preventDefault();
  const t = await (await fetch(ROOT+"templates/brand-monthly/samples/synthetic_brand_monthly.tsv")).text();
  $('data').value = t;
};
</script>
</body>
</html>
